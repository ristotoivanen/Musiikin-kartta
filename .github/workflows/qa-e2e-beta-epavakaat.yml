name: "QA e2e beta epävakaat"

# Vain tutkimushaara. Ei yhdistetä. Lukuoikeus, ei retryjä.
# Toinen kierros: täydessä WebKit-ajossa (run 46157941882) kaatunut practice:639, perustaso vastaan korjaus.
on:
  push:
    branches: [qa/e2e-beta-epavakaat-linux]

permissions:
  contents: read

jobs:
  mic-639:
    name: "practice-639 ${{ matrix.variant }}"
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        variant: [base, fix]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Check out measured revision
        run: |
          cp playwright.qa-webkit.config.ts "$RUNNER_TEMP/webkit.config.ts"
          git checkout --detach "${{ matrix.variant == 'base' && '9600d05f13ee20ad2a63863e838cdb5b02f140e9' || '7c5e4e48af29d32835ea5a93d7c26a720df7441d' }}"
          cp "$RUNNER_TEMP/webkit.config.ts" playwright.qa-webkit.config.ts
          git rev-parse HEAD
      - run: npm ci
      - run: npx playwright install --with-deps webkit
      - run: npx playwright test -c playwright.qa-webkit.config.ts -g "äänikortin valinta" --workers=2 --retries=0 --repeat-each=20 --reporter=line
