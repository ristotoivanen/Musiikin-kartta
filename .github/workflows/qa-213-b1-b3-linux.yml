name: QA 213 B1-B3 Linux
on:
  push:
    branches: [qa/213-b1-b3-linux]
    paths:
      - '.github/workflows/qa-213-b1-b3-linux.yml'
permissions:
  contents: read
jobs:
  fixed:
    if: github.ref == 'refs/heads/qa/213-b1-b3-linux'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 9412c99f66c4351761f8e5ed8974b01c61e142a8
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Verify baseline and install
        run: |
          test "$(git rev-parse HEAD)" = 9412c99f66c4351761f8e5ed8974b01c61e142a8
          cat /etc/os-release
          node --version
          npm ci
          npx playwright --version
          npx playwright install --with-deps chromium
          node -e 'const {chromium}=require("@playwright/test"); (async()=>{const b=await chromium.launch(); console.log("Chromium:", b.version()); await b.close();})()'
          git diff --exit-code HEAD
      - name: Run B1-B3 with fix in desktop and phone
        run: |
          mkdir -p qa-213-results
          set -o pipefail
          npx playwright test tests/e2e/aihesivut.spec.ts tests/e2e/otelautaopas-beta.spec.ts --grep 'Kitaran perusteet · jokainen askel|ristiinlinkitys avaa saman|Soittopakin Otelautaopas on tämä sivu' --workers=3 2>&1 | tee qa-213-results/b1-b3.log
      - name: Full changed spec files
        run: |
          set -o pipefail
          npx playwright test tests/e2e/aihesivut.spec.ts tests/e2e/otelautaopas-beta.spec.ts --workers=3 --reporter=line 2>&1 | tee qa-213-results/files.log
      - name: Full Chromium regression
        run: |
          set -o pipefail
          npx playwright test --workers=3 --max-failures=20 --reporter=line 2>&1 | tee qa-213-results/full.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qa-213-b1-b3-linux-fixed
          path: |
            qa-213-results/
            test-results/
          retention-days: 14
