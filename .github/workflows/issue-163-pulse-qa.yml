name: "Issue 163 pulse cue QA"
on:
  push:
    branches:
      - codex/issue-163-pulssivihje
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-and-unit:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Lint, typecheck, Vitest and build
        run: npm run lint && npm run typecheck && npm test && npm run build
      - name: Generated HTML, links and compatibility (#117)
        run: |
          python3 tools/oppimiskartta/rakenna.py --tarkista
          python3 tools/linkit/tarkista-linkit.py

  chromium:
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Full Playwright desktop and phone regression
        run: npx playwright test --workers=3 --max-failures=20

  webkit-pulse:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps webkit
      - name: Two-bar pulse cue on desktop Safari and iPhone emulation
        run: npx playwright test --config=playwright.issue-163-webkit.config.ts --workers=2 --max-failures=6
