name: Verify rhythmic melody beta pilots

on:
  push:
    branches: [feature/melodiset-pilotit-pentatoninen-ja-jooninen]

permissions:
  contents: read

concurrency:
  group: melodic-pilots-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint, unit tests, TypeScript and production build
        run: npm run check
      - name: Verify existing song assets
        run: npm run check:song-audio
      - name: Install Chromium browsers
        run: npx playwright install --with-deps chromium
      - name: Full desktop and mobile-emulated browser regression
        run: npm run test:e2e -- --workers=2
