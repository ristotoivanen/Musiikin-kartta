name: "QA 217 Riffikaiku timeout Linux"

# Vain tutkimushaara. Ei yhdistetä. Lukuoikeus, ei retryjä.
# Kolmas kierros: toisen kierroksen (run 46150567307) Otelautaopas-aikakatkaisun kohdistus.
on:
  push:
    branches: [qa/217-riffikaiku-timeout-linux]

permissions:
  contents: read

jobs:
  otelautaopas-282-repeat:
    name: otelautaopas-282-repeat ${{ matrix.variant }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        variant: [base, fix]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Check out measured revision
        run: |
          cp playwright.qa-217-webkit.config.ts "$RUNNER_TEMP/webkit.config.ts"
          git checkout --detach "${{ matrix.variant == 'base' && '9600d05f13ee20ad2a63863e838cdb5b02f140e9' || '4441b25ca5b399cd55e7be97a382b0a13581be9a' }}"
          cp "$RUNNER_TEMP/webkit.config.ts" playwright.qa-217-webkit.config.ts
          git rev-parse HEAD
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test tests/e2e/otelautaopas-beta.spec.ts:282 --project=desktop --workers=3 --retries=0 --repeat-each=15 --reporter=list
