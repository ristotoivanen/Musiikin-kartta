name: Verify main to beta integration

on:
  push:
    branches:
      - integration/main-iphone-fixes-into-beta

permissions:
  contents: read

concurrency:
  group: verify-main-iphone-into-beta
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout integration commit
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Lint, unit tests and TypeScript / Vite build
        run: npm run check
      - name: Verify audio inventory
        run: npm run check:song-audio
      - name: Install Chromium for desktop and mobile emulation
        run: npx playwright install --with-deps chromium
      - name: Run complete Playwright suite on Chromium and mobile emulation
        run: npm run test:e2e -- --workers=2
