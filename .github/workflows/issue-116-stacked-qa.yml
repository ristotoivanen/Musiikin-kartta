name: Issue 116 stacked implementation gate
on:
  push:
    branches:
      - codex/issue-116-kahdeksan-aihesivua
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: issue-116-stacked-${{ github.ref }}
  cancel-in-progress: true

jobs:
  structure:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check #116 structure and legacy progress
        run: npx vitest run tests/issue-116-aihesivut.test.ts
      - name: Check full project
        run: npm run check
      - name: Verify generated pages and links
        run: |
          python3 tools/oppimiskartta/rakenna.py --tarkista
          python3 tools/linkit/tarkista-linkit.py
