name: M0 M2 Actual Audio Balance 160

on:
  push:
    branches:
      - chatgpt/160-m2-steel-single-exercise

permissions:
  contents: read

concurrency:
  group: m2-steel-160-audio-levels-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Measure decoded audio RMS and peaks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install numeric analysis dependency
        run: python -m pip install 'numpy==2.1.3'
      - name: Analyze M0 30%, M2 Steel 2.4x, and B backing 55%
        shell: bash
        run: |
          set -euo pipefail
          ffmpeg -version | head -n 1
          python tools/soitinpankki/m2_balance_report.py | tee "$RUNNER_TEMP/m2-level-report.txt"
          {
            echo '## M0/M2 source level analysis (QA only)'
            echo 'Values are decoded sample RMS and peak in dBFS, not perceptual SPL.'
            echo ''
            echo '\`\`\`json'
            cat "$RUNNER_TEMP/m2-level-report.txt"
            echo '\`\`\`'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Attach reproducible level report
        uses: actions/upload-artifact@v4
        with:
          name: m0-m2-actual-levels
          path: ${{ runner.temp }}/m2-level-report.txt
          retention-days: 14
