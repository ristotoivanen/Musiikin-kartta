name: Soitinpankki 132 QA

on:
  push:
    branches:
      - chatgpt/132-meta-steel-library-pilot
  pull_request:
    branches: [beta]
    paths:
      - 'assets/soitinpankki/**'
      - 'testit/soitinpankki-kirjasto/**'
      - 'tests/soitinpankki-kirjasto.test.*'
      - 'tests/e2e/soitinpankki-kirjasto.spec.ts'
      - '.github/workflows/soitinpankki-132-qa.yml'

permissions:
  contents: read

concurrency:
  group: soitinpankki-132-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    outputs:
      first_failure: ${{ steps.browser.outputs.first_failure }}
      first_error: ${{ steps.browser.outputs.first_error }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout tested commit
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install pinned dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        shell: bash
        run: |
          set +e
          npm run typecheck > typecheck.log 2>&1
          result=$?
          cat typecheck.log
          {
            echo '### TypeScript-diagnostiikka'
            echo '\`\`\`'
            sed -n '1,120p' typecheck.log
            echo '\`\`\`'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$result"
      - name: Unit tests
        run: npm test
      - name: Build
        run: npm run build
      - name: Explicit Meta Steel unit tests
        run: npx vitest run tests/soitinpankki-kirjasto.test.ts
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Browser regression tests, desktop and phone emulation
        id: browser
        shell: bash
        run: |
          set +e
          npx playwright test tests/e2e/soitinpankki-kirjasto.spec.ts --project=desktop --project=phone --workers=2 > playwright.log 2>&1
          code=$?
          cat playwright.log
          failed=$(grep -m1 -E '^[[:space:]]*[0-9]+\) \[' playwright.log || true)
          error=$(grep -m1 -E 'Error:|TimeoutError:' playwright.log || true)
          failed=${failed:0:230}
          error=${error:0:230}
          echo "first_failure=${failed:-PASS}" >> "$GITHUB_OUTPUT"
          echo "first_error=${error:-Not available}" >> "$GITHUB_OUTPUT"
          exit "$code"
      - name: Upload browser failure traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: soitinpankki-132-test-results
          path: test-results/
          if-no-files-found: ignore

  browser_report:
    if: always()
    needs: quality
    name: "First failing test: ${{ needs.quality.outputs.first_failure }}"
    runs-on: ubuntu-24.04
    steps:
      - run: echo 'First failing test is displayed in this check name.'

  browser_error:
    if: always()
    needs: quality
    name: "First Playwright error: ${{ needs.quality.outputs.first_error }}"
    runs-on: ubuntu-24.04
    steps:
      - run: echo 'First Playwright error is displayed in this check name.'
