name: Soitinpankki 132 QA

on:
  push:
    branches:
      - chatgpt/132-meta-steel-library-pilot
  pull_request:
    branches: [beta]
    paths:
      - 'assets/soitinpankki/**'
      - 'testit/soitinpankki-kirjasto/**'
      - 'tests/soitinpankki-kirjasto.test.*'
      - 'tests/e2e/soitinpankki-kirjasto.spec.ts'
      - '.github/workflows/soitinpankki-132-qa.yml'

permissions:
  contents: read

concurrency:
  group: soitinpankki-132-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout tested commit
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install pinned dependencies
        run: npm ci
      - name: Static checks, unit tests and build
        run: npm run check
      - name: Explicit Meta Steel unit tests
        run: npx vitest run tests/soitinpankki-kirjasto.test.ts
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Browser regression tests, desktop and phone emulation
        run: npx playwright test tests/e2e/soitinpankki-kirjasto.spec.ts --project=desktop --project=phone --workers=2
      - name: Upload browser failure traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: soitinpankki-132-test-results
          path: test-results/
          if-no-files-found: ignore
