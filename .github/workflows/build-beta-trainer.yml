name: Build beta trainer assets

on:
  push:
    branches: [beta]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: beta-trainer-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout beta
        uses: actions/checkout@v4
        with:
          ref: beta
          persist-credentials: true
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build browser assets
        run: npm run build
      - name: Commit and push generated browser assets
        run: |
          git add -A assets/harjoittelija/
          if git diff --cached --quiet; then
            echo "Browser assets are already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "build: refresh beta trainer browser assets [skip ci]"
          git push origin HEAD:beta
