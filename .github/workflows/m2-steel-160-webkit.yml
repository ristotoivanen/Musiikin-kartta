name: M2 Steel 160 WebKit QA

on:
  push:
    branches:
      - chatgpt/160-m2-steel-single-exercise
    paths:
      - 'playwright.webkit-160.config.ts'
      - '.github/workflows/m2-steel-160-webkit.yml'
      - 'assets/soitinpankki/**'
      - 'tests/e2e/m2-steel-qa.spec.ts'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: m2-steel-160-webkit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  webkit:
    name: WebKit desktop and phone emulation (not physical Safari)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install pinned project dependencies
        run: npm ci
      - name: Install WebKit browser and Linux dependencies
        run: npx playwright install --with-deps webkit
      - name: Run M2 Steel regressions on WebKit
        run: npx playwright test tests/e2e/m2-steel-qa.spec.ts --config playwright.webkit-160.config.ts --workers=2
      - name: Save failure traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: m2-steel-160-webkit-failures
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
