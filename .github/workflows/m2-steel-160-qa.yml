name: M2 Steel 160 Exercise QA

on:
  push:
    branches:
      - chatgpt/160-m2-steel-single-exercise

permissions:
  contents: read

concurrency:
  group: m2-steel-160-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint, typecheck, unit tests and build
        run: npm run check
      - name: Ensure M2 Steel uses same B backing and exact CC0 source files
        run: npx vitest run tests/m2-steel-qa.test.ts
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Playwright desktop and mobile emulation
        run: npx playwright test tests/e2e/m2-steel-qa.spec.ts --project=desktop --project=phone --workers=2
      - name: Save browser traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: m2-steel-160-qa-failure
          path: test-results/
          if-no-files-found: ignore
