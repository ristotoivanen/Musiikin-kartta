name: QA 213 B5 B6 verification
on:
  push:
    branches: [qa/213-b5-b6-verification]
permissions:
  contents: read
env:
  QA_HEAD: a9682bd24063725613e7a71b25f5c2093f6dc4e1
  QA_TREE: b0ccaf03659099ac9caeb66051c670d484b6a6ef
  QA_BASE: 0c20d724f2aa284b7bd2bf781e9e672b93ab382e
  QA_B4_BLOB: f1c51dbc7a63c8936e20cff0bffc87770be8dc62
  QA_D2_BLOB: d34a86381be34105204b37135a7dfa914561c225
jobs:
  qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        suite: [check, mutations, d2, chromium]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.QA_HEAD }}
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: |
          test "$(git rev-parse HEAD)" = "$QA_HEAD"
          test "$(git rev-parse 'HEAD^{tree}')" = "$QA_TREE"
          test "$(git show -s --format=%P HEAD | cut -d ' ' -f2)" = "$QA_BASE"
          test "$(git rev-parse HEAD:tests/e2e/practice.spec.ts)" = "$QA_B4_BLOB"
          test "$(git rev-parse HEAD:tests/e2e/fixtures/d2-audio-reference.json)" = "$QA_D2_BLOB"
          git show -s --format='HEAD=%H tree=%T parents=%P %s' HEAD
          sha256sum tests/e2e/practice.spec.ts tests/e2e/fixtures/d2-audio-reference.json
          cat /etc/os-release
          uname -m
          node --version
          npm ci
          npx playwright --version
          mkdir qa-output
      - if: matrix.suite != 'check'
        run: |
          npx playwright install --with-deps chromium
          DEBUG=pw:browser node --input-type=module -e 'import {chromium} from "@playwright/test"; const b=await chromium.launch(); console.log(b.version()); await b.close();'
      - if: matrix.suite == 'check'
        run: npm run check
      - if: matrix.suite == 'mutations'
        run: |
          set -o pipefail
          node docs/qa/d2-b5-b6-213/mutations.mjs | tee qa-output/mutations.jsonl
          test "$(wc -l < qa-output/mutations.jsonl)" -eq 32
      - if: matrix.suite == 'd2'
        run: PLAYWRIGHT_JSON_OUTPUT_FILE=qa-output/d2.json npx playwright test tests/e2e/song-d2*.spec.ts --workers=3 --retries=0 --reporter=line,json
      - if: matrix.suite == 'chromium'
        run: PLAYWRIGHT_JSON_OUTPUT_FILE=qa-output/chromium.json npx playwright test --project=desktop --project=phone --workers=3 --retries=0 --reporter=line,json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qa-213-${{ matrix.suite }}
          path: qa-output/
          if-no-files-found: ignore
