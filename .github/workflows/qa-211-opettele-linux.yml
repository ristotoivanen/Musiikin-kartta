name: QA 211 Opettele Linux
on:
  push:
    branches: [qa/211-opettele-linux]
    paths:
      - '.github/workflows/qa-211-opettele-linux.yml'
permissions:
  contents: read
env:
  BASE: 9d5ad0c9981ff80ca91166474c9523a29b352a7f
  FIX: 566f3cff2de622dfb6b0f09fad545e358f6f967a
jobs:
  webkit-side:
    if: github.ref == 'refs/heads/qa/211-opettele-linux'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.BASE }}
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          path: .qa
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install
        run: |
          test "$(git rev-parse HEAD)" = "$BASE"
          npm ci
          npx playwright install --with-deps webkit
          cp .qa/qa/211/webkit.config.ts playwright.qa211-webkit.config.ts
      - name: Repeat the two other WebKit failures on unmodified base
        run: |
          npx playwright test -c playwright.qa211-webkit.config.ts --grep 'nopeat peräkkäiset painallukset|äänikortin valinta' --repeat-each=20 --workers=3 --retries=0 --trace=off --reporter=line > wk.log 2>&1 || true
          grep -aE '(passed|failed|flaky)( \(|$)|^ +[0-9]+\) \[|Error:|Expected|Received|^ +> +[0-9]+ \|' wk.log | sed 's/\x1b\[[0-9;]*[A-Za-z]//g' | sed -E 's/^ +[0-9]+\) (\[[^]]+\])/FAIL \1/; s/ *─+$//' | sort | uniq -c | sort -rn | head -60
      - name: Unit test counts on fix
        run: |
          git checkout -q . && rm playwright.qa211-webkit.config.ts && rm -rf .qa
          git fetch -q --depth=1 origin "$FIX" && git checkout -q "$FIX"
          npm run check > check.log 2>&1; echo "check exit $?"
          grep -aE 'Test Files|Tests +[0-9]' check.log
          git status --short
