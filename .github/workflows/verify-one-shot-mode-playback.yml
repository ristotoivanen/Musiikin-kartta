name: Verify one-shot mode scale playback

on:
  push:
    branches:
      - fix/modes-one-shot-scale-no-phrase

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint, unit tests, TypeScript and build
        run: npm run check
      - name: Verify audio files
        run: npm run check:song-audio
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Full desktop and mobile-browser regression
        run: npm run test:e2e -- --workers=2
