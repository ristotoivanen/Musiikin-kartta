name: Verify full memory melody before improvisation

on:
  push:
    branches: [fix/melody-memory-full-no-part-choice]

permissions:
  contents: read

concurrency:
  group: melody-memory-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint, unit tests, typecheck, build
        run: npm run check
      - name: Verify existing MP3 assets
        run: npm run check:song-audio
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Full browser regression desktop and mobile
        run: npm run test:e2e -- --workers=2
