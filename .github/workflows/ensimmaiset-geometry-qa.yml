name: First Four Beats Geometry Diagnostics
on:
  push:
    branches: [chatgpt/130-regression-and-rights-review]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: first-four-beats-geom-${{ github.ref }}
  cancel-in-progress: true
jobs:
  geometry:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Log viewport and beat guide geometry
        run: npx playwright test tests/e2e/ensimmaiset-geometry-qa.spec.ts --project=desktop --workers=1
