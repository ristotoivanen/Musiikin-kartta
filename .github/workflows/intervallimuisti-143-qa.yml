name: Intervallimuisti #143 isolated QA
on:
  push:
    branches: [codex/intervallimuisti-mobiili-a11y-143]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  targeted:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Diagnostic measurements
        run: npx playwright test tests/e2e/intervallimuisti-143-diagnostic.spec.ts --workers=2 --reporter=line
