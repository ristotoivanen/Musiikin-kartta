name: Intervallimuisti #143 isolated QA
on:
  push:
    branches: [codex/intervallimuisti-mobiili-a11y-143]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  targeted:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Static checks, unit tests and build
        run: npm run check
      - name: Generated lesson and links
        run: |
          python3 tools/oppimiskartta/rakenna.py --tarkista
          node tools/versioi-tyylit.mjs --tarkista
          python3 tools/linkit/tarkista-linkit.py
      - run: npx playwright install --with-deps chromium webkit
      - name: Intervallimuisti browser regressions, Chromium and WebKit
        run: npx playwright test tests/e2e/intervallimuisti.spec.ts --config=playwright.intervallimuisti-143.config.ts --workers=4 --reporter=line
      - name: Upload failure traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: intervallimuisti-143-failure
          path: test-results/
          if-no-files-found: ignore
