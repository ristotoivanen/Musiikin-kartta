name: Verify initial mode learning journey

on:
  push:
    branches: [feature/mode-learning-journey-v1]
  pull_request:
    branches: [beta]

permissions:
  contents: write

concurrency:
  group: mode-learning-journey-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint, unit tests, TypeScript, and Vite build
        run: npm run check
      - name: Verify MP3 inventory
        run: npm run check:song-audio
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Run full browser regression suite
        run: npm run test:e2e -- --workers=2
      - name: Cache bust browser bundle
        if: github.event_name == 'push'
        run: |
          node --input-type=module <<'NODE'
          import { createHash } from 'node:crypto';
          import { readFileSync, writeFileSync } from 'node:fs';
          const bytes = readFileSync('assets/harjoittelija/app.js');
          const hash = createHash('sha256').update(bytes).digest('hex').slice(0, 12);
          const path = 'kitaraharjoittelija.html';
          const before = readFileSync(path, 'utf8');
          const search = /assets\/harjoittelija\/app\.js(?:\?v=[a-f0-9]{12})?/;
          if (!search.test(before)) throw new Error('Missing app.js import');
          writeFileSync(path, before.replace(search, 'assets/harjoittelija/app.js?v=' + hash));
          NODE
      - name: Publish tested browser assets to feature branch
        if: github.event_name == 'push'
        run: |
          git add -A assets/harjoittelija/ kitaraharjoittelija.html
          if git diff --cached --quiet; then
            echo "Browser assets already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "build: publish tested mode learning preview"
          git push origin HEAD:feature/mode-learning-journey-v1
