name: "Issue 116 Sävelkorva QA"
on:
  push:
    branches:
      - claude/116-savelkorva-ydinopinnot
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-and-unit:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Ensure generated pages are committed (show diff on mismatch)
        run: |
          python3 tools/oppimiskartta/rakenna.py
          git diff --stat
          test -z "$(git status --porcelain)"
      - name: Lint, typecheck, Vitest and build
        run: npm run check
      - name: Generated HTML, links and compatibility (#117)
        run: |
          python3 tools/oppimiskartta/rakenna.py --tarkista
          python3 tools/linkit/tarkista-linkit.py

  chromium:
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Sävelkorva and shared Ydinopinnot UI first
        run: npx playwright test tests/e2e/savelkorva-ydinopinnot.spec.ts tests/e2e/ydinopinnot-yhteinen-ui.spec.ts --workers=2 --retries=0
      - name: Full Playwright desktop and phone regression
        run: npx playwright test --workers=3 --max-failures=20 --retries=0

  webkit-savelkorva:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps webkit
      - name: Sävelkorva Ydinopinnot on desktop Safari and iPhone emulation
        run: npx playwright test --config=playwright.savelkorva-116-webkit.config.ts --workers=2 --max-failures=10 --retries=0
