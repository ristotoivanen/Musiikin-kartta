<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Ääniesimerkkien generaattori – Musiikin kartta</title>
<link rel="stylesheet" href="../../assets/otelauta.css">
<style>
  main { padding-bottom: 40px; }
  #list { display: grid; gap: 8px; margin-top: 16px; }
  .row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; padding: 8px 12px; background: var(--panel); border-radius: 8px; }
  .row code { min-width: 230px; }
  .row .state { color: var(--muted); font-size: 13px; }
  .row audio { height: 32px; }
</style>
</head>
<body>
<main>
  <h1>Ääniesimerkkien generaattori</h1>
  <p class="tools-note">Renderöi kirjan ääniesimerkit harjoitustaustojen soittimilla. Kuuntele esimerkki painamalla <b>Kuuntele</b>. <b>Tallenna kaikki</b> toimii vain, kun sivu on avattu palvelimella <code>python3 tools/aanet/palvelin.py</code>.</p>
  <button type="button" id="save-all">Tallenna kaikki</button>
  <p class="tools-note" id="status" role="status"></p>
  <div id="list"></div>
</main>
<script src="../../assets/otelauta.js"></script>
<script src="../../assets/harjoitustausta.js"></script>
<script src="esimerkit.js"></script>
<script>
(function () {
  const list = document.getElementById('list');
  const status = document.getElementById('status');

  function wav(buffer) {
    const channels = buffer.numberOfChannels;
    const frames = buffer.length;
    const view = new DataView(new ArrayBuffer(44 + frames * channels * 2));
    const text = (offset, value) => [...value].forEach((c, i) => view.setUint8(offset + i, c.charCodeAt(0)));
    text(0, 'RIFF'); view.setUint32(4, 36 + frames * channels * 2, true); text(8, 'WAVE');
    text(12, 'fmt '); view.setUint32(16, 16, true); view.setUint16(20, 1, true); view.setUint16(22, channels, true);
    view.setUint32(24, buffer.sampleRate, true); view.setUint32(28, buffer.sampleRate * channels * 2, true);
    view.setUint16(32, channels * 2, true); view.setUint16(34, 16, true);
    text(36, 'data'); view.setUint32(40, frames * channels * 2, true);
    const data = Array.from({ length: channels }, (_, c) => buffer.getChannelData(c));
    for (let i = 0, offset = 44; i < frames; i++) {
      for (let c = 0; c < channels; c++, offset += 2) {
        const value = Math.max(-1, Math.min(1, data[c][i]));
        view.setInt16(offset, value < 0 ? value * 32768 : value * 32767, true);
      }
    }
    return new Blob([view], { type: 'audio/wav' });
  }

  const rows = aanet.examples.map(example => {
    const row = document.createElement('div');
    row.className = 'row';
    row.innerHTML = '<code></code><button type="button">Kuuntele</button><span class="state"></span>';
    row.querySelector('code').textContent = example.file;
    const state = row.querySelector('.state');
    const render = async () => {
      state.textContent = 'Renderöidään…';
      const buffer = await example.build().render();
      state.textContent = buffer.duration.toFixed(1) + ' s';
      return buffer;
    };
    row.querySelector('button').addEventListener('click', async () => {
      const blob = wav(await render());
      row.querySelector('audio')?.remove();
      const audio = document.createElement('audio');
      audio.controls = true;
      audio.src = URL.createObjectURL(blob);
      row.append(audio);
      audio.play();
    });
    list.append(row);
    return { example, render, state };
  });

  document.getElementById('save-all').addEventListener('click', async () => {
    for (const [index, { example, render, state }] of rows.entries()) {
      status.textContent = 'Tallennetaan ' + (index + 1) + '/' + rows.length + ': ' + example.file;
      const response = await fetch('/tallenna/' + example.file + '.wav', { method: 'PUT', body: wav(await render()) });
      if (!response.ok) {
        status.textContent = 'Tallennus epäonnistui: ' + example.file + ' (' + response.status + ')';
        return;
      }
      state.textContent += ' · tallennettu';
    }
    status.textContent = 'Kaikki ' + rows.length + ' esimerkkiä tallennettu.';
  });
})();
</script>
</body>
</html>
