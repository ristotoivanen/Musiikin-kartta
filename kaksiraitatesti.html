<!DOCTYPE html>
<html lang="fi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Kahden raidan synkronointitesti – Musiikin kartta</title>
  <!-- Testiversio issue #9:ää varten. Ei linkitetty sivustolta, ei tuotantosoitin. -->
  <style>
    :root { color-scheme: light dark; --fg: #1f1d2b; --bg: #f7f5fb; --muted: #5d5873; --accent: #4b2fd6; --line: #d8d3e8; --warn: #a3122b; }
    @media (prefers-color-scheme: dark) { :root { --fg: #ece9f6; --bg: #17151f; --muted: #aaa4c0; --accent: #a594ff; --line: #3a3550; --warn: #ff8a9b; } }
    body { margin: 0; background: var(--bg); color: var(--fg); font: 16px/1.5 system-ui, -apple-system, sans-serif; }
    main { max-width: 52rem; margin: 0 auto; padding: 1rem; }
    h1 { font-size: 1.4rem; margin: 0.5rem 0; }
    h2 { font-size: 1.1rem; margin: 1.5rem 0 0.4rem; }
    a { color: var(--accent); }
    button { font: inherit; padding: 0.6rem 0.9rem; margin: 0.2rem 0.2rem 0.2rem 0; border-radius: 0.5rem; border: 1px solid var(--line); background: transparent; color: var(--fg); }
    button.play { background: var(--accent); color: #fff; border-color: var(--accent); min-width: 8rem; font-weight: 600; }
    button:disabled { opacity: 0.4; cursor: not-allowed; }
    .files { font-size: 0.9rem; font-variant-numeric: tabular-nums; }
    .time { display: inline-block; margin-left: 0.5rem; font-variant-numeric: tabular-nums; }
    .hint { color: var(--muted); font-size: 0.9rem; }
    .error { color: var(--warn); font-weight: 600; }
    .live, table { font-variant-numeric: tabular-nums; }
    table { border-collapse: collapse; width: 100%; font-size: 0.9rem; display: block; overflow-x: auto; }
    th, td { border-bottom: 1px solid var(--line); padding: 0.3rem 0.5rem; text-align: left; white-space: nowrap; }
    .measurements { font-size: 0.85rem; padding-left: 1.2rem; }
    .measurements li[data-reliable="ei"] { color: var(--muted); }
    textarea { width: 100%; box-sizing: border-box; font: 12px/1.4 ui-monospace, monospace; }
  </style>
</head>
<body>
  <div id="kaksiraitatesti"><p style="padding:1rem">Ladataan testiä…</p></div>
  <script type="module" src="assets/kaksiraitatesti/app.js?v=ab49e5339d6c"></script>
</body>
</html>
